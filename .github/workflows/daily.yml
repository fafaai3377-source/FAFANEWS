name: FAFA NEWS 매일 브리핑

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 오전 7시 KST (UTC+9 → UTC 22:00 전날)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install pillow pymupdf requests

      - name: Pretendard 폰트 설치
        run: |
          mkdir -p /tmp/fonts
          cd /tmp/fonts
          npm install pretendard@1.3.9
          cp node_modules/pretendard/dist/public/static/Pretendard-*.otf .

      - name: PDF 생성
        run: python3 render_carousel.py

      - name: 이메일 발송
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: fafaai3377@gmail.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'fafaai3377@gmail.com' }}
        run: |
          PDF=$(ls output/*.pdf | sort | tail -1)
          DATE_LABEL=$(date +'%Y년 %m월 %d일 (%a)' | sed 's/Mon/월/;s/Tue/화/;s/Wed/수/;s/Thu/목/;s/Fri/금/;s/Sat/토/;s/Sun/일/')
          python3 send_email.py "$PDF" "$DATE_LABEL"

      - name: PDF 아티팩트 저장 (7일 보관)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fafa-news-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 7
