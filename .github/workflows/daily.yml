name: FAFA NEWS 이메일 발송

on:
  push:
    branches: [main]
    paths:
      - 'output/**.pdf'   # 세션이 PDF를 푸시하면 자동 트리거
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 이메일 발송
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: fafaai3377@gmail.com
        run: |
          PDF=$(ls output/*.pdf | sort | tail -1)
          echo "발송 대상: $PDF"
          DATE_LABEL=$(python3 -c "
          import datetime, locale
          try:
              locale.setlocale(locale.LC_TIME, 'ko_KR.UTF-8')
          except:
              pass
          d = datetime.date.today()
          days = ['월','화','수','목','금','토','일']
          print(f'{d.year}년 {d.month:02d}월 {d.day:02d}일 ({days[d.weekday()]})')
          ")
          python3 send_email.py "$PDF" "$DATE_LABEL"

      - name: PDF 아티팩트 저장 (30일 보관)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fafa-news-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 30
